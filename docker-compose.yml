name: codex-gateway
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
    networks: [gateway-internal]
  api:
    build: ./backend
    environment: &shared
      REDIS_URL: redis://redis:6379/0
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-120}
      CHAT_WAIT_SECONDS: ${CHAT_WAIT_SECONDS:-90}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      LOG_REQUEST_BODIES: ${LOG_REQUEST_BODIES:-false}
    depends_on:
      redis: {condition: service_healthy}
    networks: [gateway-internal, gateway-public]
    restart: unless-stopped
  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379/0
      HOME: /home/node
      CODEX_HOME: /home/node/.codex
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-120}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
    volumes:
      - codex_auth:/home/node/.codex
    depends_on:
      redis: {condition: service_healthy}
    networks: [gateway-internal]
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on: [api]
    networks: [gateway-public]
    restart: unless-stopped
networks:
  gateway-internal:
    internal: false
  gateway-public:
    name: codex-gateway-public
volumes:
  codex_auth:
