# Keep the Compose project and existing resource names stable for upgrades.
name: codex-gateway
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
    networks: [gateway-internal]
  api:
    build: ./backend
    environment: &shared
      REDIS_URL: redis://redis:6379/0
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      AGY_DEFAULT_MODEL: ${AGY_DEFAULT_MODEL:-}
      OPENCODE_DEFAULT_MODEL: ${OPENCODE_DEFAULT_MODEL:-}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-120}
      CHAT_WAIT_SECONDS: ${CHAT_WAIT_SECONDS:-90}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      LOG_REQUEST_BODIES: ${LOG_REQUEST_BODIES:-false}
      DEFAULT_TOOL_EXECUTION: ${DEFAULT_TOOL_EXECUTION:-auto}
    depends_on:
      redis: {condition: service_healthy}
    networks: [gateway-internal, gateway-public]
    restart: unless-stopped
  worker:
    build: ./worker
    environment:
      REDIS_URL: redis://redis:6379/0
      HOME: /home/node
      CODEX_HOME: /home/node/.codex
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-120}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      ENABLED_PROVIDERS: ${ENABLED_PROVIDERS:-codex,agy,opencode}
      OPENCODE_MODEL_FILTER: ${OPENCODE_MODEL_FILTER:-}
      WORKER_TRACE: ${WORKER_TRACE:-false}
      CLI_WORKSPACE_DIR: ${CLI_WORKSPACE_DIR:-/work}
      AGENT_ALLOW_NETWORK: ${AGENT_ALLOW_NETWORK:-true}
      AGY_TOOL_PERMISSION: ${AGY_TOOL_PERMISSION:-proceed-in-sandbox}
      CODEX_AGENT_SANDBOX: ${CODEX_AGENT_SANDBOX:-workspace-write}
      N8N_MCP_URL: ${N8N_MCP_URL:-}
      N8N_MCP_BEARER_TOKEN: ${N8N_MCP_BEARER_TOKEN:-}
      N8N_MCP_AUTH_HEADER: ${N8N_MCP_AUTH_HEADER:-}
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL:-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      N8N_WEBHOOK_AUTH_HEADER: ${N8N_WEBHOOK_AUTH_HEADER:-Authorization}
      N8N_WEBHOOK_TOOLS_FILE: ${N8N_WEBHOOK_TOOLS_FILE:-}
      N8N_WEBHOOK_TOOLS_JSON: ${N8N_WEBHOOK_TOOLS_JSON:-}
    volumes:
      - cli_workspace:/work
      - codex_auth:/home/node/.codex
      - agy_auth:/home/node/.gemini
      - opencode_auth:/home/node/.local/share/opencode
      - opencode_config:/home/node/.config/opencode
    depends_on:
      redis: {condition: service_healthy}
    networks: [gateway-internal, gateway-public]
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on: [api]
    networks: [gateway-public]
    restart: unless-stopped
networks:
  gateway-internal:
    internal: false
  gateway-public:
    name: codex-gateway-public
volumes:
  cli_workspace:
    name: ai-cli-gateway_cli_workspace
  codex_auth:
    name: codex-gateway_codex_auth
  agy_auth:
    name: ai-cli-gateway_agy_auth
  opencode_auth:
    name: ai-cli-gateway_opencode_auth
  opencode_config:
    name: ai-cli-gateway_opencode_config
